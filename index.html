<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Helm</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#c15f3c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Helm">

<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--bg:#f5f4ee;--ink:#141413;--mut:#6b6a63;--ac:#c15f3c;--acs:#f3e2d9;--card:#faf9f5;--line:#e3e0d3;--bad:#a32d2d;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--ink:#faf9f5;--mut:#a8a69c;--ac:#d97757;--acs:#3a2d27;--card:#30302e;--line:#454542;--bad:#f09595}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-size:17px;line-height:1.4;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
main{max-width:640px;margin:0 auto;padding:14px}
h1{font-size:26px;margin:6px 0 14px}
button,input,select{font:inherit;color:inherit}
button{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px}
.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.d{color:var(--bad)}
input[type=text],input[type=tel],input[type=email],select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:10px}.row>input{flex:1}
.bar{display:flex;justify-content:space-between;align-items:center}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;padding:0 2px;border:0;border-radius:0;background:none;min-height:60px;color:var(--mut);font-size:12px}
nav button.on{color:var(--ac);font-weight:700;box-shadow:inset 0 3px var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.doc{position:relative;text-align:left;padding:16px 12px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between;background:var(--card)}
.doc b{font-size:16px;word-break:break-word}.doc small{color:var(--mut);font-size:13px}
.tag{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--acs);color:var(--ac);width:max-content}
.edit .doc{outline:2px dashed var(--line)}
.doc{border:1px solid var(--line);border-radius:12px;cursor:pointer}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}.mini{padding:6px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;background:var(--bg)}.mini.bad{color:var(--bad)}
.doc input[type=text]{margin:6px 0}
textarea{width:100%;min-height:96px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;resize:vertical;margin:8px 0}
.hd{display:flex;gap:8px;align-items:center}.hd button{min-height:40px;padding:4px 10px}
.x{position:absolute;top:4px;right:4px;min-height:34px;padding:2px 10px;color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:14px}
.card h2{font-size:18px;margin:0}.card .cnt{color:var(--mut);font-size:14px}
.it{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.it input[type=checkbox]{width:24px;height:24px;accent-color:var(--ac);flex:none}
.it span{flex:1;word-break:break-word}.it.done span{text-decoration:line-through;color:var(--mut)}
.it button{min-height:36px;padding:2px 10px}
.note{display:block;width:100%;text-align:left;margin-bottom:10px}.note small{display:block;color:var(--mut)}
.tb{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;position:sticky;top:0;background:var(--bg);padding:6px 0;z-index:2}
.tb button{min-width:44px;padding:6px 10px}.tb select{width:auto}
#ed{min-height:46vh;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;outline:none}
 button:disabled{opacity:.4}
.row>select{flex:1;width:auto}a.doc{text-decoration:none;color:var(--ink)}
.mut{color:var(--mut)}.empty{color:var(--mut);padding:20px 0;text-align:center}
.fi{position:fixed;left:0;top:0;width:1px;height:1px;opacity:0;pointer-events:none}
a.bt,label.bt{color:var(--ink);text-decoration:none;display:flex;align-items:center;justify-content:center;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-height:44px;cursor:pointer}
a.bt.p,label.bt.p{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
#fbar{position:fixed;left:0;right:0;bottom:calc(61px + env(safe-area-inset-bottom));z-index:4;display:flex;gap:6px;padding:6px 10px;background:var(--card);border-top:1px solid var(--line)}#fbar:empty{display:none}#fbar button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-height:42px;padding:6px 8px;border-color:var(--ac)}body.hf{padding-bottom:calc(132px + env(safe-area-inset-bottom))}
#evbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:8px;align-items:center;padding:8px 14px;background:var(--bg);border-bottom:1px solid var(--line)}
#evbar select{flex:1;font-weight:700}
#evp{display:none;position:absolute;right:14px;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;gap:8px;flex-direction:column;box-shadow:0 8px 20px #0005;min-width:180px}#evp.on{display:flex}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:none;z-index:30}
#vw{position:fixed;inset:0;background:var(--bg);z-index:20;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
#vw.on{display:flex}
#vh{display:flex;gap:8px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--card)}
#vh b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vfav{display:flex;gap:6px;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line)}#vfav:empty{display:none}#vfav button{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:6px 8px;min-height:40px}
.fv{position:absolute;top:0;right:0;padding:8px 12px;font-size:20px;line-height:1;color:var(--ac)}.doc.fav{border-color:var(--ac)}
#vtool{display:none;position:relative;background:var(--bg);border-bottom:1px solid var(--line);padding:6px 10px}#vtool.on{display:block}
#bmp{position:absolute;top:100%;left:10px;right:10px;margin-top:4px;max-height:55vh;overflow:auto;z-index:6;box-shadow:0 8px 20px #0006}
#vb{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;padding:10px calc(10px + env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) 10px;touch-action:pan-x pan-y pinch-zoom}
.paper{background:#fff;color:#000;border-radius:8px;padding:16px;overflow-x:auto;line-height:1.5}
.paper img{max-width:100%;height:auto}.paper a{color:#0b57d0}
.paper table{border-collapse:collapse;font-size:14px}.paper td,.paper th{border:1px solid #ccc;padding:4px 8px;white-space:pre-wrap;vertical-align:top}
#pgs{width:max-content;min-width:100%}.pg{background:#fff;margin:0 auto 10px;display:block;box-shadow:0 1px 4px #0003;position:relative;scroll-margin-top:8px}
.bm{position:absolute;top:6px;left:6px;z-index:2;min-height:36px;padding:2px 12px;background:var(--card);color:var(--ink);box-shadow:0 1px 4px #0004}
.sheets{display:flex;gap:6px;overflow-x:auto;margin-bottom:8px}.sheets button{white-space:nowrap;min-height:38px}.sheets .on{background:var(--ac);color:#fff;border-color:var(--ac)}
#ns{position:fixed;left:0;right:0;bottom:0;z-index:25;display:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -8px 20px #0005}#ns.on{display:block}
#nsa{width:100%;min-height:120px;margin-top:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font:inherit;resize:vertical}
.nbw{position:absolute;z-index:1;overflow:hidden;cursor:pointer;border:1px dashed #b7a64a;background:rgba(255,238,140,.3);border-radius:3px;box-sizing:border-box}
.nbw .nt{color:#0b3d91;font-size:calc(var(--s,1)*10.5px);line-height:1.25;padding:calc(var(--s,1)*3px) calc(var(--s,1)*4px);white-space:pre-wrap;word-break:break-word;font-family:system-ui,sans-serif}
.nbw .nt.e{color:#8a7a1d;opacity:.75}.nbw .nt.e::before{content:'Tap to add a note'}
.fr{background:rgba(255,238,140,.75);overflow:visible}.fr .nt{overflow:hidden;height:100%}
.fx{position:absolute;top:-13px;right:-8px;min-height:28px;min-width:28px;padding:0;border-radius:14px;background:var(--card);color:var(--bad)}
#print{display:none}
@media print{body>*:not(#print){display:none!important}#print{display:block;color:#000;background:#fff;font-size:14pt}body{padding:0;background:#fff}}
</style></head><body>
<div id="evbar"><select id="evsel" aria-label="Event"></select><button id="evm" aria-label="Event options">&#8943;</button><div id="evp"><button id="evr">Rename event</button><button id="evd" class="d">Delete event</button></div></div>
<main id="app"></main>
<nav id="nav"></nav>
<div id="fbar"></div>
<div id="vw"><div id="vh"><button id="vx">Close</button><b id="vt"></b><button id="vo">Open outside</button></div><div id="vfav"></div><div id="vtool"></div><div id="vb"></div></div>
<div id="ns"><b id="nst"></b><textarea id="nsa" placeholder="Type your note"></textarea><div class="row" style="margin:8px 0 0"><button class="p" id="nsd" style="flex:1">Done</button></div></div>
<div id="toast"></div>
<div id="print"></div>
<input type="file" id="fp" class="fi" multiple>
<input type="file" id="imp" class="fi">
<input type="file" id="rf" class="fi">
<script>
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,10);
const blank=()=>({docs:[],lists:[],notes:[],people:[],apps:[]});
const evData=e=>e.data=Object.assign(blank(),e.data);
let R=null;try{R=JSON.parse(localStorage.getItem('ov2')||'null')}catch(e){}
if(!R||!Array.isArray(R.events)||!R.events.length){let old={};try{old=JSON.parse(localStorage.getItem('ov')||'{}')}catch(e){}R={cur:'e1',events:[{id:'e1',name:'Event 1',data:old}]}}
R.events.forEach(evData);
const curEv=()=>R.events.find(e=>e.id==R.cur)||R.events[0];
R.cur=curEv().id;
let D=curEv().data;
const persist=()=>localStorage.setItem('ov2',JSON.stringify(R));
const KEYS=['docs','lists','notes','people','apps'],H={},last={};let lastTyp=null,lastT=0;
const resetHist=()=>KEYS.forEach(k=>{H[k]={u:[],r:[]};last[k]=JSON.stringify(D[k])});resetHist();
const refreshHB=()=>{document.querySelectorAll('[data-un]').forEach(b=>b.disabled=!H[b.dataset.un].u.length);document.querySelectorAll('[data-re]').forEach(b=>b.disabled=!H[b.dataset.re].r.length)};
const save=typing=>{const now=Date.now();let typed=null;
 KEYS.forEach(k=>{const j=JSON.stringify(D[k]);if(j===last[k])return;
  if(!(typing&&lastTyp===k&&now-lastT<2000)){H[k].u.push(last[k]);if(H[k].u.length>100)H[k].u.shift()}
  H[k].r=[];last[k]=j;if(typing)typed=k});
 if(typed){lastTyp=typed;lastT=now}else lastTyp=null;
 persist();refreshHB()};
async function hist(k,dir){const h=H[k],from=dir<0?h.u:h.r,to=dir<0?h.r:h.u;
 if(!from.length)return toast(dir<0?'Nothing to undo':'Nothing to redo');
 to.push(last[k]);const j=from.pop();D[k]=JSON.parse(j);last[k]=j;lastTyp=null;persist();
 if(k=='docs'){renId=null;await loadUrls()}
 edL=null;edI=null;pf=null;af=null;render();toast(dir<0?'Undone':'Redone')}
const hb=k=>`<div class="row"><button data-un="${k}" style="flex:1" ${H[k].u.length?'':'disabled'}>\u21B6 Undo</button><button data-re="${k}" style="flex:1" ${H[k].r.length?'':'disabled'}>\u21B7 Redo</button></div>`;
document.addEventListener('click',e=>{const b=e.target.closest('[data-un],[data-re]');if(!b||b.disabled)return;if(b.dataset.un)hist(b.dataset.un,-1);else hist(b.dataset.re,1)});
let tab='docs',editMode=false,openNote=null;const urls={};
const db=new Promise((ok,no)=>{const r=indexedDB.open('ov',1);r.onupgradeneeded=()=>r.result.createObjectStore('f');r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
const idb=async(m,k,v)=>{const d=await db;return new Promise((ok,no)=>{const s=d.transaction('f',m=='get'||m=='keys'?'readonly':'readwrite').objectStore('f');const q=m=='put'?s.put(v,k):m=='get'?s.get(k):m=='keys'?s.getAllKeys():s.delete(k);q.onsuccess=()=>ok(q.result);q.onerror=()=>no(q.error)})};
const esc=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',2200)}
async function loadUrls(){for(const d of D.docs){if(urls[d.id])continue;try{const b=await idb('get',d.id);if(b)urls[d.id]=URL.createObjectURL(b)}catch(e){}}}
const ext=n=>(n.split('.').pop()||'').toLowerCase();
function openDoc(d){const u=urls[d.id];if(!u)return toast('File not found. Re-attach it.');const a=document.createElement('a');a.href=u;if(ext(d.fname)=='pdf')a.target='_blank';else a.download=d.fname;document.body.appendChild(a);a.click();a.remove()}

function render(){
 $('#nav').innerHTML=[['docs','Docs'],['lists','Lists'],['notes','Notes'],['people','People'],['apps','Apps'],['set','Settings']].map(([k,l])=>`<button class="${tab==k?'on':''}" data-t="${k}">${l}</button>`).join('');
 $('#nav').onclick=e=>{const t=e.target.dataset.t;if(t){tab=t;openNote=null;render()}};
 renderEv();renderBar();
 const A=$('#app');A.onclick=A.onchange=A.oninput=A.onkeydown=null;
 ({docs:rDocs,lists:rLists,notes:rNotes,people:rPeople,apps:rApps,set:rSet})[tab]();
}
const LIBS={
 pdf:['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js'],
 wk:['https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js','https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js'],
 docx:['https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js','https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js'],
 pdflib:['https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js','https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js'],
 xlsx:['https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js','https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js']};
const loaded={};
const loadJs=u=>new Promise((ok,no)=>{const e=document.createElement('script');e.src=u;e.crossOrigin='anonymous';e.onload=ok;e.onerror=()=>{e.remove();no()};document.head.appendChild(e)});
const lib=k=>loaded[k]||(loaded[k]=(async()=>{for(const u of LIBS[k]){try{await loadJs(u);return}catch(e){}}delete loaded[k];throw new Error('offline')})());
async function pdfWorker(){if(pdfWorker.u)return pdfWorker.u;for(const u of LIBS.wk){try{const r=await fetch(u);if(!r.ok)continue;return pdfWorker.u=URL.createObjectURL(new Blob([await r.text()],{type:'text/javascript'}))}catch(e){}}throw new Error('offline')}
let vwOpen=false,curDoc=null;
function renderEv(){$('#evsel').innerHTML=R.events.map(e=>`<option value="${e.id}"${e.id==R.cur?' selected':''}>${esc(e.name)}</option>`).join('')+'<option value="__new">+ Add event\u2026</option>'}
async function switchEv(id){R.cur=id;D=evData(curEv());resetHist();persist();editMode=false;openNote=null;pf=null;af=null;edL=null;edI=null;renId=null;$('#evp').classList.remove('on');await loadUrls();render()}
$('#evsel').onchange=e=>{const v=e.target.value;if(v=='__new'){const n=(prompt('Name of the new event')||'').trim();if(!n){renderEv();return}const ev={id:uid(),name:n,data:blank()};R.events.push(ev);switchEv(ev.id)}else switchEv(v)};
$('#evm').onclick=()=>$('#evp').classList.toggle('on');
$('#evr').onclick=()=>{$('#evp').classList.remove('on');const n=(prompt('Event name',curEv().name)||'').trim();if(n){curEv().name=n;persist();renderEv()}};
$('#evd').onclick=async()=>{$('#evp').classList.remove('on');if(R.events.length<2)return toast('Keep at least one event');const ev=curEv();if(!confirm('Delete \u201C'+ev.name+'\u201D and everything in it?'))return;for(const d of ev.data.docs)await idb('del',d.id);R.events=R.events.filter(x=>x.id!=ev.id);switchEv(R.events[0].id)};
function renderBar(){const f=D.docs.filter(x=>x.fav);$('#fbar').innerHTML=f.map(x=>`<button data-fb="${x.id}">★ ${esc(x.name)}</button>`).join('');document.body.classList.toggle('hf',f.length>0)}
$('#fbar').onclick=e=>{const b=e.target.closest('[data-fb]');if(!b)return;const d=D.docs.find(x=>x.id==b.dataset.fb);if(d)viewDoc(d)};
function renderFav(){const f=D.docs.filter(x=>x.fav);$('#vfav').innerHTML=f.map(x=>`<button data-fv="${x.id}" class="${curDoc&&curDoc.id==x.id?'p':''}">★ ${esc(x.name)}</button>`).join('')}
$('#vfav').onclick=e=>{const b=e.target.closest('[data-fv]');if(!b)return;const d=D.docs.find(x=>x.id==b.dataset.fv);if(d&&(!curDoc||curDoc.id!=d.id))viewDoc(d)};
function closeV(){$('#vfav').innerHTML='';$('#ns').classList.remove('on');$('#vw').classList.remove('on');$('#vb').innerHTML='';$('#vb').onscroll=null;$('#vtool').className='';$('#vtool').innerHTML='';vwOpen=false;curDoc=null}
$('#vx').onclick=()=>{if(vwOpen)history.back()};
$('#vo').onclick=()=>{if(curDoc)openDoc(curDoc)};
window.addEventListener('popstate',()=>{if(vwOpen)closeV()});
async function viewDoc(d){
 if(!urls[d.id])return toast('File not found. Re-attach it.');
 $('#ns').classList.remove('on');$('#vtool').className='';$('#vtool').innerHTML='';$('#vb').onscroll=null;
 curDoc=d;renderFav();$('#vt').textContent=d.name;$('#vb').innerHTML='<p class="empty">Loading\u2026</p>';$('#vw').classList.add('on');
 if(!vwOpen){vwOpen=true;history.pushState({v:1},'')}
 const x=ext(d.fname);
 try{
  const blob=await idb('get',d.id);
  if(x=='pdf')await showPdf(blob);
  else if(x=='docx')await showDocx(blob);
  else if(['xlsx','xls','csv'].includes(x))await showSheet(blob);
  else if(['txt','md'].includes(x))$('#vb').innerHTML=`<div class="paper"><pre style="white-space:pre-wrap;margin:0;font:inherit">${esc(await blob.text())}</pre></div>`;
  else if(['png','jpg','jpeg','gif','webp'].includes(x))$('#vb').innerHTML=`<div class="paper"><img src="${urls[d.id]}"></div>`;
  else $('#vb').innerHTML='<p class="empty">This file type can\u2019t be shown inside Helm. Tap Open outside to open it in another app.</p>'
 }catch(e){
  $('#vb').innerHTML=e&&e.message=='offline'?'<p class="empty">The viewer needs internet the first time you open this kind of file. Connect once and it will work offline after that.</p>':'<p class="empty">Couldn\u2019t show this file inside Helm. Tap Open outside to open it in another app.</p>'}
}
async function showPdf(blob){
 await lib('pdf');pdfjsLib.GlobalWorkerOptions.workerSrc=await pdfWorker();
 const pdf=await pdfjsLib.getDocument({data:await blob.arrayBuffer()}).promise;
 const vb=$('#vb'),vt=$('#vtool'),d=curDoc,N=pdf.numPages,bx={};let z=1,gen=0,panel=false,editP=null,addMode=false,cur=null,ready;
 if((d.marks||[]).some(m=>typeof m=='number'))d.marks=d.marks.map(m=>typeof m=='number'?{p:m,n:''}:m);
 vt.className='on';
 vt.innerHTML=`<div class="bar" style="gap:8px"><span class="mut" id="pn">${N} page${N>1?'s':''}</span><span class="row" style="margin:0"><button id="zm">\u2212</button><button id="zp">+</button></span></div><div class="row" style="margin:8px 0 0"><button id="bmc" style="flex:1">Bookmarks</button><button id="adn" style="flex:1">+ Note</button><button id="exp" class="p" style="flex:1">Save PDF</button></div><div id="bmp" class="card" style="display:none"></div>`;
 vb.innerHTML='<div id="pgs"></div>';
 const wrap=$('#pgs'),bmp=$('#bmp'),marks=()=>d.marks||[],find=p=>marks().find(m=>m.p==p);

 const info=async i=>{if(!bx[i]){const pg=await pdf.getPage(i),v=pg.getViewport({scale:1}),tc=await pg.getTextContent(),boxes=[];

 <div class="grid ${appEdit?'edit':''}">${D.apps.map(a=>appEdit?`<div class="doc"><b>${esc(a.name)}</b><span class="acts"><span class="mini" data-ea="${a.id}">Edit</span><span class="mini bad" data-da="${a.id}">Delete</span></span></div>`:`<a class="doc" href="${esc(appHref(a.target))}"><b>${esc(a.name)}</b><small>Tap to open</small></a>`).join('')}</div>

 if($('#an'))$('#an').onclick=()=>{af={};render()};

  if(!v.name||!v.target)return toast('Enter a name and a package name or link');

let pf=null;
function rPeople(){
 const f=pf,fld=(k,l,t)=>`<input type="${t||'text'}" data-f="${k}" placeholder="${l}" value="${esc(f[k]||'')}" style="margin-bottom:8px">`;
 const list=D.people.slice().sort((a,b)=>(a.dept||'').localeCompare(b.dept||'')||(a.name||'').localeCompare(b.name||''));
 $('#app').innerHTML=`<div class="bar"><h1>People</h1>${f?'':'<button class="p" id="ap">+ Add person</button>'}</div>${hb('people')}
 ${f?`<div class="card"><h2>${f.id?'Edit person':'New person'}</h2><div style="height:8px"></div>${fld('name','Name')}${fld('dept','Department')}${fld('role','Role (e.g. Overseer)')}${fld('phone','Phone, with country code (+1 555 123 4567)','tel')}${fld('email','Email','email')}<div class="row"><button class="p" id="sv" style="flex:1">Save</button><button id="cx" style="flex:1">Cancel</button></div></div>`:''}
 ${list.map(p=>{const dg=(p.phone||'').replace(/\D/g,'');return `<div class="card"><div class="bar"><h2>${esc(p.name)}</h2>${p.dept?`<span class="tag">${esc(p.dept)}</span>`:''}</div>${p.role?`<div class="mut">${esc(p.role)}</div>`:''}<div class="mut" style="word-break:break-all">${esc(p.phone||'')}${p.phone&&p.email?' · ':''}${esc(p.email||'')}</div>
 <div class="row" style="margin-top:10px">${dg?`<a class="bt" href="tel:${esc(p.phone.replace(/[^\d+]/g,''))}" style="flex:1">📞 Call</a><a class="bt" href="https://wa.me/${dg}" target="_blank" rel="noopener" style="flex:1">💬 WhatsApp</a>`:''}${p.email?`<a class="bt" href="mailto:${esc(p.email)}" style="flex:1">✉️ Email</a>`:''}</div>
 <div class="bar"><button data-ep="${p.id}">Edit</button><button class="d" data-dp="${p.id}">Delete</button></div></div>`}).join('')}
 ${list.length||f?'':'<p class="empty">No people yet. Add the overseers and contacts you may need to reach, then call, message or email them with one tap.</p>'}`;
 if($('#ap'))$('#ap').onclick=()=>{pf={};render()};
 if($('#cx'))$('#cx').onclick=()=>{pf=null;render()};
 if($('#sv'))$('#sv').onclick=()=>{const v={};document.querySelectorAll('[data-f]').forEach(i=>v[i.dataset.f]=i.value.trim());
  if(!v.name)return toast('Enter a name');
  if(f.id)Object.assign(D.people.find(x=>x.id==f.id),v);else D.people.push(Object.assign({id:uid()},v));

 $('#app').onclick=e=>{const t=e.target.dataset;

function rSet(){
 $('#app').innerHTML=`<h1>Settings</h1><div class="card"><h2>Backup</h2><p class="mut">Saves your documents, checklists and notes in one file. Do this before clearing your browser data or switching phones.</p>
 <div class="row"><button class="p" id="ex" style="flex:1">Export backup</button><label class="bt" for="imp" style="flex:1">Import backup</label></div></div>
 <div class="card"><h2>Stored here</h2><p class="mut">This event: ${D.docs.length} documents, ${D.lists.length} checklists, ${D.notes.length} notes, ${D.people.length} people, ${D.apps.length} app buttons. Everything stays on this device.</p></div>
 <div class="card"><h2>Erase this event</h2><p class="mut">Empties the current event only. Your other events are not touched. Export a backup first.</p><button class="d" id="er">Erase this event\u2019s data</button></div>`;
 $('#er').onclick=async()=>{if(!confirm('Erase all documents, checklists, notes, people and app buttons in this event?'))return;if(!confirm('This cannot be undone without a backup. Erase now?'))return;for(const d of D.docs)await idb('del',d.id);for(const k in urls)delete urls[k];Object.assign(D,blank());resetHist();persist();render();toast('This event was erased')};
 $('#ex').onclick=async()=>{
  try{const files={};for(const d of R.events.flatMap(e=>e.data.docs)){const b=await idb('get',d.id);if(b)files[d.id]=await new Promise(r=>{const f=new FileReader();f.onload=()=>r(f.result);f.readAsDataURL(b)})}
  const blob=new Blob([JSON.stringify({v:2,R,files})],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='oversight-backup-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();toast('Backup file created')}catch(e){toast('Backup failed')}};
}
$('#imp').onchange=async e=>{
 const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const j=JSON.parse(await f.text());const nr=j.R||(j.data?{cur:'e1',events:[{id:'e1',name:'Event 1',data:j.data}]}:null);if(!nr||!Array.isArray(nr.events)||!nr.events.length)throw 0;
  if(!confirm('Replace everything on this device with the backup?'))return;
  for(const d of R.events.flatMap(e=>e.data.docs))await idb('del',d.id);
  for(const id in urls)delete urls[id];
  for(const id in j.files||{}){const b=await (await fetch(j.files[id])).blob();await idb('put',id,b)}
  R=nr;R.events.forEach(evData);D=curEv().data;R.cur=curEv().id;resetHist();persist();await loadUrls();render();toast('Backup restored')}catch(x){toast('That file is not a valid backup')}};
render();loadUrls();
idb('keys').then(ks=>(ks||[]).forEach(k=>{if(!R.events.some(e=>e.data.docs.some(d=>d.id==k)))idb('del',k)})).catch(()=>{});
if('serviceWorker' in navigator&&location.protocol.indexOf('http')==0)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
